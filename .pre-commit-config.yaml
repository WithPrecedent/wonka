repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: "v6.0.0"
  hooks:
  - id: check-added-large-files
    # The lock file lists every package and its hashes.
    exclude: ^uv\.lock$
  - id: check-ast
  - id: check-json
  - id: check-toml
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: trailing-whitespace

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.17
  hooks:
    # Run the linter. The formatter is not used because it removes the spaces
    # around "=" in keyword arguments and moves closing brackets onto their own
    # lines (see CONTRIBUTING.md).
    - id: ruff
      args: [ --fix ]

- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 0.11.21
  hooks:
    - id: uv-lock
